name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: Aerotools-UAV/aerotools-site-prueba
          publish_branch: main
          publish_dir: ./_site
          cname: prueba.aerotools.es
          enable_jekyll: false
          user_name: saez_ro
          user_email: ro.saezescobar@outlook.com
